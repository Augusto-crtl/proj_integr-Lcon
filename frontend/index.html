<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Web — Kit LTR701</title>
  <!-- TailwindCSS, React 18, Babel, Axios e Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
  <div id="root"></div>

  <!-- Scripts auxiliares do projeto -->
  <script src="js/api.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/simulacao.js"></script>
 
  <!-- Aplicação React -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Componente reutilizável de Gráfico (Chart.js)
    // Reutiliza uma instância Chart.js e atualiza séries e marcadores de anomalia sem recriar o canvas.
    function GraficoLinha({ titulo, labels, dados, cor, unidade, indicesAnomalia = new Set() }) { // Aceita os índices sinalizados para destacá-los no gráfico.
      const canvasRef = useRef(null);
      const chartRef = useRef(null);


      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) {
          chartRef.current.data.labels = labels;
          chartRef.current.data.datasets[0].data = dados;
          chartRef.current.data.datasets[0].pointBackgroundColor = dados.map((_, indice) => indicesAnomalia.has(indice) ? "#dc2626" : cor); // Atualiza as cores dos pontos de anomalia.
          chartRef.current.data.datasets[0].pointRadius = dados.map((_, indice) => indicesAnomalia.has(indice) ? 6 : 0); // Destaca pontos sinalizados sem poluir os demais.
          chartRef.current.update("none");
          return;
        }

        chartRef.current = new Chart(canvasRef.current, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: `${titulo} (${unidade})`,
              data: dados,
              borderColor: cor,
              backgroundColor: cor + "22",
              borderWidth: 2,
              pointBackgroundColor: dados.map((_, indice) => indicesAnomalia.has(indice) ? "#dc2626" : cor), // Destaca anomalias em vermelho no gráfico.
              pointRadius: dados.map((_, indice) => indicesAnomalia.has(indice) ? 6 : 0), // Exibe marcadores apenas para amostras sinalizadas.
              tension: 0.2,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: {
              x: { ticks: { maxTicksLimit: 8 } },
            },
          },
        });

        return () => {
          if (chartRef.current) {
            chartRef.current.destroy();
            chartRef.current = null;
          }
        };
      }, [labels, dados]);

      return (
        <div className="bg-white p-4 rounded-xl shadow-sm border">
          <h3 className="font-semibold text-sm text-slate-700 mb-2">{titulo}</h3>
          <div className="h-56">
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      );
    }

    // Tela 1: Login e Cadastro
    // Alterna cadastro e login, guarda token e perfil após resposta válida da API.
    function TelaLogin({ onLogin }) {
      const [cadastro, setCadastro] = useState(false);
      const [nome, setNome] = useState("");
      const [email, setEmail] = useState("");
      const [senha, setSenha] = useState("");
      const [aviso, setAviso] = useState("");

      const entrar = (usuario) => {
        localStorage.setItem("user", JSON.stringify(usuario));
        onLogin(usuario);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setAviso("");
        try {
          const rota = cadastro ? "/auth/register" : "/auth/login";
          const payload = cadastro ? { name: nome, email, password: senha } : { email, password: senha };
          const { data } = await api.post(rota, payload);
          localStorage.setItem("token", data.token);
          entrar(data.user);
        } catch (error) {
          setAviso(error.response?.data?.message || "Não foi possível autenticar com o servidor Laravel.");
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="bg-white p-8 rounded-xl shadow-md w-full max-w-md space-y-5">
            <h1 className="text-2xl font-bold text-center">
              {cadastro ? "Criar Conta" : "Acesso — Kit LTR701"}
            </h1>

            {aviso && <p className="text-xs bg-amber-50 text-amber-800 p-3 rounded border border-amber-200">{aviso}</p>}

            <form onSubmit={handleSubmit} className="space-y-4">
              {cadastro && (
                <div>
                  <label className="block text-sm font-medium">Nome</label>
                  <input type="text" required value={nome} onChange={(e) => setNome(e.target.value)} className="w-full mt-1 p-2 border rounded-lg" />
                </div>
              )}
              <div>
                <label className="block text-sm font-medium">E-mail</label>
                <input type="email" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full mt-1 p-2 border rounded-lg" />
              </div>
              <div>
                <label className="block text-sm font-medium">Senha</label>
                <input type="password" required value={senha} onChange={(e) => setSenha(e.target.value)} className="w-full mt-1 p-2 border rounded-lg" />
              </div>
              <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium">
                {cadastro ? "Cadastrar" : "Entrar"}
              </button>
            </form>

            <button onClick={() => setCadastro(!cadastro)} className="w-full text-sm text-blue-600 hover:underline">
              {cadastro ? "Já tem conta? Fazer login" : "Não tem conta? Cadastre-se"}
            </button>

          </div>
        </div>
      );
    }

    // Tela 2: Dashboard, Controle Remoto e Estatística
    // Consulta telemetria periodicamente e separa comandos reais da simulação local opcional.
    function TelaDashboard() {
      const [horas, setHoras] = useState([]);
      const [temps, setTemps] = useState([]);
      const [leiturasReais, setLeiturasReais] = useState([]); // Mantém os registros reais para relacionar anomalias aos horários recebidos.
      const [setpoint, setSetpoint] = useState(45);
      const [appliedSetpoint, setAppliedSetpoint] = useState(null);
      const [ativo, setAtivo] = useState(false);
      const [status, setStatus] = useState("Desconectado");
      const [simulacaoAtiva, setSimulacaoAtiva] = useState(false); // Controla a simulação manualmente, sem depender da conexão detectada.
      const controleSimuladoRef = useRef({ ligado: ativo, alvo: appliedSetpoint ?? setpoint }); // Mantém a entrada mais recente do PI para a planta simulada.
      controleSimuladoRef.current = { ligado: ativo, alvo: appliedSetpoint ?? setpoint }; // Atualiza o estado local sem reiniciar a consulta da API.
      const [commandMessage, setCommandMessage] = useState(""); // Armazena mensagens de retorno das ações do controlador.
      const latestReadingId = useRef(0);
      const pendingCommand = useRef(null);
      const temperaturaSimulada = useRef(29); // Inicia a simulação próxima de vinte e nove graus Celsius.
      const leiturasSimuladas = useRef([]); // Armazena somente no navegador o histórico simulado exibido.
      const gerarLeituraSimulada = () => { // Gera uma amostra local quando o usuário ativa a simulação.
        const agora = new Date(); // Marca o horário da amostra simulada.
        const alvoSimulado = controleSimuladoRef.current.ligado ? controleSimuladoRef.current.alvo : 29; // Usa o setpoint quando o controlador simulado está ligado.
        const erroSimulado = alvoSimulado - temperaturaSimulada.current; // Calcula o erro entre o alvo e a temperatura local.
        temperaturaSimulada.current += erroSimulado * 0.08 + (Math.random() - 0.5) * 0.02; // Simula resposta térmica gradual com pequeno ruído.
        leiturasSimuladas.current = [...leiturasSimuladas.current, { hora: agora.toLocaleTimeString(), temperatura: Number(temperaturaSimulada.current.toFixed(3)) }].slice(-60); // Mantém as sessenta amostras locais mais recentes.
        setHoras(leiturasSimuladas.current.map((leitura) => leitura.hora)); // Atualiza o eixo de tempo com horários simulados.
        setTemps(leiturasSimuladas.current.map((leitura) => leitura.temperatura)); // Atualiza o gráfico com temperaturas simuladas.
      }; // Finaliza a geração de uma amostra simulada.


      useEffect(() => {
        const atualizar = async () => {
          try {
            const { data } = await api.get("/readings/history?limit=60");
            if (data.length === 0) { // Trata a ausência de leituras reais sem depender do estado da conexão.
              if (simulacaoAtiva) { // Executa a planta local somente se a simulação estiver ativa.
                gerarLeituraSimulada(); // Aplica localmente o estado e o setpoint do PI.
              } else { // Limpa dados locais quando a simulação estiver desativada.
                leiturasSimuladas.current = []; // Descarta amostras simuladas anteriores.
                setHoras([]); // Limpa horários quando não existem leituras reais.
                setTemps([]); // Limpa temperaturas quando não existem leituras reais.
                setLeiturasReais([]); // Limpa as anomalias quando não há leituras reais.
              } // Finaliza a atualização sem leituras recebidas.
              setStatus("Desconectado"); // Exibe a ausência de conexão sem controlar o PI.
              return; // Encerra esta consulta sem dados reais.
            }

            const latestReading = data.at(-1); // Obtém a leitura mais recente persistida pelo MATLAB.
            const ageSeconds = (Date.now() - new Date(latestReading.received_at || latestReading.recorded_at).getTime()) / 1000; // Calcula a idade da leitura a partir do recebimento pelo Laravel.
            const conexaoDetectada = Number.isFinite(ageSeconds) && ageSeconds <= 6; // Usa somente a atualidade da telemetria para indicar a conexão.
            setStatus(conexaoDetectada ? "Conectado" : "Desconectado"); // Atualiza o rótulo e a bolinha sem afetar o controle PI.
            if (simulacaoAtiva) { // Usa dados simulados somente quando o botão está ativo.
              gerarLeituraSimulada(); // Atualiza o gráfico com dados locais simulados.
            } else { // Mostra as leituras recebidas do MATLAB quando a simulação está desligada.
              leiturasSimuladas.current = []; // Descarta o histórico simulado ao voltar aos dados reais.
              setHoras(data.map((leitura) => new Date(leitura.recorded_at).toLocaleTimeString())); // Atualiza o eixo temporal das leituras reais.
              setTemps(data.map((leitura) => Number(leitura.variables?.temp ?? 0))); // Atualiza o gráfico com as temperaturas recebidas.
              setLeiturasReais(data.map((leitura) => ({ id: leitura.id, recorded_at: leitura.recorded_at, temperatura: Number(leitura.variables?.temp) })).filter((leitura) => Number.isFinite(leitura.temperatura))); // Guarda apenas temperaturas reais válidas para a análise.
            } // Finaliza a seleção independente da fonte de dados.
            latestReadingId.current = Number(latestReading.id) || latestReadingId.current;
            const reportedStatus = latestReading?.variables?.system_status; // Obtém o estado enviado pelo controlador MATLAB.
            if (!simulacaoAtiva && (reportedStatus === "ON" || reportedStatus === "OFF")) { // Atualiza o estado do controlador somente no modo real.
              setAtivo(reportedStatus === "ON"); // Mostra se o controlador PI está ligado.
            } // Finaliza a atualização do indicador do controlador.
            const reportedSetpoint = Number(latestReading?.variables?.setpoint);
            if (!simulacaoAtiva && Number.isFinite(reportedSetpoint)) setAppliedSetpoint(reportedSetpoint); // Atualiza o setpoint aplicado somente com confirmação real.


            const queuedCommand = pendingCommand.current;
            if (!simulacaoAtiva && queuedCommand && latestReadingId.current > queuedCommand.afterReadingId) {
              const confirmed = queuedCommand.name === "setpoint"
                ? Math.abs(reportedSetpoint - queuedCommand.value) < 0.000001
                : reportedStatus === (queuedCommand.value === 1 ? "ON" : "OFF");
              if (confirmed) {
                setCommandMessage(queuedCommand.name === "setpoint"
                  ? `Setpoint aplicado: ${queuedCommand.value} °C.` // Confirma em português a aplicação do setpoint.
                  : `Controlador ${queuedCommand.value === 1 ? "ligado" : "desligado"}.`); // Confirma em português o estado do controlador.
                pendingCommand.current = null;
              }
            }
          } catch { // Trata a falha da API sem bloquear a simulação local.
            setStatus("Desconectado"); // Atualiza somente o indicador de conexão.
            if (simulacaoAtiva) { // Executa a planta local somente se a simulação estiver ativa.
              gerarLeituraSimulada(); // Mantém a resposta local do controlador PI.
            } else { // Limpa dados locais quando a simulação estiver desativada.
              leiturasSimuladas.current = []; // Descarta amostras simuladas antigas.
              setHoras([]); // Limpa horários sem telemetria real.
              setTemps([]); // Limpa temperaturas sem telemetria real.
              setLeiturasReais([]); // Limpa anomalias antigas quando a consulta falha.
            } // Finaliza o tratamento de falha da API.
          }
        };

        atualizar();
        const timer = setInterval(atualizar, 2000);
        return () => clearInterval(timer);
      }, [simulacaoAtiva]); // Reinicia a consulta somente quando o modo de simulação é alternado.

      const enviarSetpoint = async (e) => {
        e.preventDefault();
        try {
          const value = Number(setpoint); // Converte o valor digitado antes de aplicar o setpoint.
          if (simulacaoAtiva) { // Aplica o setpoint localmente sem aguardar o MATLAB.
            setAppliedSetpoint(value); // Atualiza imediatamente o setpoint simulado.
            setCommandMessage(`Setpoint aplicado na simulação: ${value} °C.`); // Confirma a ação simulada de forma imediata.
            return; // Evita enviar comandos simulados à API real.
          }
          await api.post("/commands/add", { name: "setpoint", value });
          pendingCommand.current = {
            name: "setpoint",
            value,
            afterReadingId: latestReadingId.current,
          };
          setCommandMessage("Aguardando a confirmação do controlador."); // Apresenta uma mensagem única de espera em português.
        } catch (error) {
          setCommandMessage(error.response?.data?.message || "Could not send the setpoint command to Laravel.");
        }
      };

      const alternarFlag = async () => {
        const novo = !ativo; // Calcula o próximo estado solicitado para o controlador.
        if (simulacaoAtiva) { // Alterna o controlador localmente no modo de simulação.
          setAtivo(novo); // Atualiza imediatamente o estado do PI simulado.
          setCommandMessage(`Controlador ${novo ? "ligado" : "desligado"} na simulação.`); // Confirma a alteração sem mensagem de espera.
          return; // Não envia comandos simulados ao Laravel.
        }
        try {
          const value = novo ? 1 : 0;
          await api.post("/commands/add", { name: "flag", value });
          pendingCommand.current = {
            name: "flag",
            value,
            afterReadingId: latestReadingId.current,
          };
          setCommandMessage("Aguardando a confirmação do controlador."); // Apresenta uma mensagem única de espera em português.
        } catch (error) {
          setCommandMessage(error.response?.data?.message || "Could not send the controller command to Laravel.");
        }
      };

      const stats = calcularEstatisticas(temps);
      const janelaAnomalia = 10; // Define a quantidade de amostras anteriores usadas como referência local.
      const limiteDesvioPadrao = 3; // Sinaliza temperaturas além de três desvios padrão da janela anterior.
      const anomalias = simulacaoAtiva ? [] : leiturasReais.map((leitura, indice, leituras) => { // Analisa somente leituras reais para não misturar dados simulados.
        const anteriores = leituras.slice(Math.max(0, indice - janelaAnomalia), indice).map((item) => item.temperatura); // Seleciona até dez amostras anteriores à leitura avaliada.
        if (anteriores.length < 5) return null; // Aguarda cinco referências para evitar sinalização baseada em amostra pequena.
        const mediaAnterior = anteriores.reduce((soma, valor) => soma + valor, 0) / anteriores.length; // Calcula a média histórica local.
        const varianciaAnterior = anteriores.reduce((soma, valor) => soma + (valor - mediaAnterior) ** 2, 0) / anteriores.length; // Calcula a variância populacional da janela anterior.
        const desvioPadraoAnterior = Math.sqrt(varianciaAnterior); // Obtém a dispersão das amostras de referência.
        const limiteMinimo = Math.max(0.25, desvioPadraoAnterior * limiteDesvioPadrao); // Aplica piso de 0,25 °C para evitar alertas por ruído quase nulo.
        return Math.abs(leitura.temperatura - mediaAnterior) > limiteMinimo ? { ...leitura, mediaAnterior, diferenca: leitura.temperatura - mediaAnterior } : null; // Marca desvios relevantes sem tratar o alerta como falha confirmada.
      }).filter(Boolean); // Remove as amostras que ficaram dentro do comportamento esperado.
      const indicesAnomalia = new Set(anomalias.map((anomalia) => leiturasReais.findIndex((leitura) => leitura.id === anomalia.id))); // Relaciona cada alerta ao ponto correspondente do gráfico.
      const textoAnomalias = anomalias.length ? `${anomalias.length} leitura(s) sinalizada(s) pela regra de ${limiteDesvioPadrao} desvios padrão em uma janela móvel de até ${janelaAnomalia} amostras anteriores (piso de 0,25 °C).` : "Nenhuma anomalia sinalizada nas leituras reais disponíveis."; // Explica o método e seu limiar na interface.
      const tempAtual = temps.length ? temps.at(-1).toFixed(3) : "--"; // Formata a temperatura atual com três casas decimais.

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h1 className="text-2xl font-bold">Monitoramento e Controle — Kit LTR701</h1>
            <div className="flex items-center gap-3"> {/* Agrupa estado da conexão e opção de simulação local. */}
              <button type="button" onClick={() => { setSimulacaoAtiva((ativa) => !ativa); pendingCommand.current = null; setCommandMessage(""); }} className="rounded-lg bg-slate-100 px-3 py-2 text-xs font-medium text-slate-700">{simulacaoAtiva ? "Desativar simulação" : "Ativar simulação"}</button> {/* Alterna a simulação manual sem alterar o estado detectado. */}
              <span className={`h-3 w-3 rounded-full ${status === "Conectado" ? "bg-emerald-500" : "bg-red-500"}`} role="img" aria-label={status === "Conectado" ? "Conexão ativa" : "Conexão inativa"} title={status === "Conectado" ? "Conectado" : "Desconectado"}></span> {/* Mostra em verde a conexão ativa e em vermelho a conexão inativa. */}
              <span className="text-xs px-3 py-1 rounded-full bg-slate-200 font-medium">{status}</span> {/* Exibe se o dashboard está conectado, offline ou simulando. */}
            </div> {/* Finaliza o agrupamento de conexão. */}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-white p-5 rounded-xl shadow-sm border">
              <p className="text-sm text-slate-500">Temperatura Atual</p>
              <p className="text-4xl font-bold text-blue-600 mt-1">{tempAtual} °C</p>
            </div>

            <form onSubmit={enviarSetpoint} className="bg-white p-5 rounded-xl shadow-sm border flex gap-2 items-end">
              <div className="flex-1">
                <label className="block text-sm text-slate-600 mb-1">Set Point (°C)</label>
                <input type="number" min="20" max="99" step="0.5" value={setpoint} onChange={(e) => setSetpoint(e.target.value)} className="w-full border rounded-lg p-2" />
              </div>
              <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">Aplicar</button>
            </form>

            <div className="bg-white p-5 rounded-xl shadow-sm border flex flex-col justify-between">
              <p className="text-sm text-slate-500">Controlador PI (Flag)</p>
              <button onClick={alternarFlag} className={`w-full py-2.5 rounded-lg text-white font-semibold ${ativo ? "bg-red-600" : "bg-emerald-600"}`}>
                {ativo ? "Desligar Controle (Flag = 0)" : "Ligar Controle (Flag = 1)"}
              </button>
              <p className="text-xs text-slate-500 mt-2">Setpoint aplicado: {appliedSetpoint ?? "--"} °C</p>
            </div>
          </div>

          {(commandMessage || status === "Aguardando leituras do MATLAB") && <p role="status" className="text-sm text-slate-600">{commandMessage || "Aguardando leituras do MATLAB."}</p>} {/* Apresenta uma mensagem em português enquanto aguarda leituras ou confirmação. */}

          <GraficoLinha titulo="Temperatura em Tempo Real / Histórico" labels={horas} dados={temps} cor="#2563eb" unidade="°C" indicesAnomalia={indicesAnomalia} />

          <section aria-live="polite" className={`rounded-xl border p-5 shadow-sm ${anomalias.length ? "border-amber-300 bg-amber-50" : "border-emerald-200 bg-white"}`}> {/* Apresenta uma área acessível com o resumo da detecção de anomalias. */}
            <h2 className="font-semibold text-slate-800">Detecção de anomalias</h2> {/* Identifica o recurso de análise de desvios. */}
            <p className="mt-1 text-sm text-slate-600">{simulacaoAtiva ? "A detecção está pausada durante a simulação local; somente leituras reais são analisadas." : textoAnomalias}</p> {/* Informa o resultado e deixa explícito o tratamento separado da simulação. */}
            {anomalias.length > 0 && <ul className="mt-3 space-y-1 text-sm text-amber-900">{anomalias.slice(-5).reverse().map((anomalia) => <li key={anomalia.id}>Leitura {anomalia.id} às {new Date(anomalia.recorded_at).toLocaleString()}: {anomalia.temperatura.toFixed(2)} °C ({anomalia.diferenca > 0 ? "+" : ""}{anomalia.diferenca.toFixed(2)} °C em relação à média anterior de {anomalia.mediaAnterior.toFixed(2)} °C).</li>)}</ul>} {/* Lista até cinco desvios recentes para facilitar a inspeção pelo operador. */}
            <p className="mt-3 text-xs text-slate-500">Este é um alerta estatístico para revisão; não confirma defeito nem substitui limites de segurança definidos para o equipamento.</p> {/* Evita interpretar o sinalizador estatístico como diagnóstico ou proteção física. */}
          </section> {/* Finaliza a área de alertas. */}

          {stats && (
            <div className="bg-white p-5 rounded-xl shadow-sm border">
              <h2 className="font-semibold text-slate-700 mb-3">Estatística Descritiva</h2>
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3 text-center">
                <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-500">Média</p><p className="text-lg font-bold">{stats.media} °C</p></div>
                <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-500">Variância</p><p className="text-lg font-bold">{stats.variancia}</p></div>
                <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-500">Assimetria</p><p className="text-lg font-bold">{stats.assimetria}</p></div>
                <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-500">Curtose</p><p className="text-lg font-bold">{stats.curtose}</p></div>
                <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-500">Outliers</p><p className="text-lg font-bold text-amber-600">{stats.outliers}</p></div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Tela 3: Sombra Digital (Simulação LCON-I com 4 gráficos)
    // Executa a planta e o PI no navegador para comparar setpoints e perturbações sem acesso à DAQ.
    function TelaSimulacao() {
      const [params, setParams] = useState({
        tempoFinal: 120, tempInicial: 25, sp1: 45, perturbacao: -5,
        instantePerturbacao: 50, sp2: 60, instanteMudancaSp: 80, kp: 0.8, ki: 0.08,
      });
      const [resultado, setResultado] = useState(null);
      const [erro, setErro] = useState("");

      const alterar = (campo, valor) => setParams({ ...params, [campo]: Number(valor) });

      const simular = (e) => {
        e.preventDefault();
        setErro("");
        if (params.sp1 <= params.tempInicial || params.sp1 >= 100) {
          setErro("O Set Point 1 deve ser maior que a temperatura inicial e menor que 100 °C.");
          return;
        }
        if (params.sp2 >= 100) {
          setErro("O Set Point 2 deve ser menor que 100 °C.");
          return;
        }
        setResultado(executarSimulacaoPI(params));
      };

      return (
        <div className="space-y-6">
          <div>
            <h1 className="text-2xl font-bold">Sombra Digital — Simulação do Sistema</h1>
            <p className="text-sm text-slate-500">Os ganhos Kp e Ki desta simulação não são enviados ao MATLAB.</p>
          </div>

          {erro && <div className="p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm">{erro}</div>}

          <form onSubmit={simular} className="bg-white p-5 rounded-xl shadow-sm border space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div><label className="text-xs font-medium">Tempo Final (s)</label><input type="number" value={params.tempoFinal} onChange={(e) => alterar("tempoFinal", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Temperatura Inicial (°C)</label><input type="number" value={params.tempInicial} onChange={(e) => alterar("tempInicial", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Set Point 1 (°C)</label><input type="number" value={params.sp1} onChange={(e) => alterar("sp1", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Set Point 2 (°C)</label><input type="number" value={params.sp2} onChange={(e) => alterar("sp2", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Instante Mudança SP (s)</label><input type="number" value={params.instanteMudancaSp} onChange={(e) => alterar("instanteMudancaSp", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Perturbação (°C)</label><input type="number" value={params.perturbacao} onChange={(e) => alterar("perturbacao", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Instante Perturbação (s)</label><input type="number" value={params.instantePerturbacao} onChange={(e) => alterar("instantePerturbacao", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Ganho Proporcional (Kp)</label><input type="number" step="0.01" value={params.kp} onChange={(e) => alterar("kp", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
              <div><label className="text-xs font-medium">Ganho Integral (Ki)</label><input type="number" step="0.001" value={params.ki} onChange={(e) => alterar("ki", e.target.value)} className="w-full border rounded p-2 mt-1" /></div>
            </div>
            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium">Executar Simulação</button>
          </form>

          {resultado && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <GraficoLinha titulo="1. Temperatura x Tempo" labels={resultado.tempos} dados={resultado.temperaturas} cor="#2563eb" unidade="°C" />
              <GraficoLinha titulo="2. Set Point x Tempo" labels={resultado.tempos} dados={resultado.setpoints} cor="#16a34a" unidade="°C" />
              <GraficoLinha titulo="3. Erro x Tempo" labels={resultado.tempos} dados={resultado.erros} cor="#dc2626" unidade="°C" />
              <GraficoLinha titulo="4. Sinal de Controle x Tempo" labels={resultado.tempos} dados={resultado.sinaisControle} cor="#9333ea" unidade="V" />
            </div>
          )}
        </div>
      );
    }

    // Tela 4: Administração (Logs e Backups)
    // Reúne consulta de auditoria e operações de backup disponíveis somente ao perfil administrador.
    function TelaAdmin() {
      const [msg, setMsg] = useState(""); // Armazena a mensagem exibida ao administrador.
      const [msgError, setMsgError] = useState(false); // Indica se a mensagem atual descreve uma falha.
      const [logs, setLogs] = useState([]); // Mantém os eventos de auditoria carregados.
      const [backups, setBackups] = useState([]); // Mantém as cópias SQLite disponíveis para administração.
      const [backupSelecionado, setBackupSelecionado] = useState(""); // Guarda a cópia selecionada explicitamente.


      useEffect(() => { // Carrega logs e cópias ao abrir a tela administrativa.
        api.get("/admin/logs") // Solicita ao servidor os eventos administrativos.
          .then(({ data }) => setLogs(data.logs)) // Armazena os eventos recebidos.
          .catch((error) => { // Trata falhas ao consultar a auditoria.
            setMsgError(true); // Marca a mensagem como erro.
            setMsg(error.response?.data?.message || "Não foi possível carregar os logs."); // Explica a falha em português.
          }); // Finaliza o tratamento da consulta de auditoria.
        api.get("/admin/backups") // Solicita a lista de cópias disponíveis.
          .then(({ data }) => { setBackups(data.backups); setBackupSelecionado(data.backups[0]?.name || ""); }) // Seleciona inicialmente a cópia mais recente.
          .catch((error) => { setMsgError(true); setMsg(error.response?.data?.message || "Não foi possível carregar os backups."); }); // Apresenta falhas ao listar cópias.
      }, []); // Executa as consultas uma vez ao abrir a tela.

      const criarBackup = async () => { // Cria uma cópia sob demanda do banco atual.
        try { // Inicia o tratamento da solicitação de criação.
          const { data } = await api.post("/admin/backups"); // Solicita ao backend uma cópia manual.
          setMsgError(false); // Limpa o estado de erro após sucesso.
          setMsg(data.message); // Exibe a confirmação do servidor.
          const { data: lista } = await api.get("/admin/backups"); // Atualiza as cópias disponíveis.
          setBackups(lista.backups); // Armazena a lista atualizada.
          setBackupSelecionado(data.backup.name); // Seleciona a cópia recém-criada.
        } catch (error) { // Trata falhas de criação ou atualização da lista.
          setMsgError(true); // Marca a mensagem como erro.
          setMsg(error.response?.data?.message || "Não foi possível criar o backup."); // Apresenta a causa em português.
        } // Finaliza o tratamento da solicitação.
      }; // Finaliza a ação de criação manual.

      const restaurar = async () => { // Restaura somente o backup escolhido pelo administrador.
        if (!backupSelecionado || !window.confirm(`A restauração substituirá os dados atuais pelo backup ${backupSelecionado}. Deseja continuar?`)) return; // Exige escolha e confirmação antes de substituir os dados.
        try { // Inicia o tratamento da solicitação de restauração.
          const { data } = await api.post("/admin/restore", { backup: backupSelecionado, confirmation: true }); // Envia a cópia e a confirmação explícita.
          setMsgError(false); // Limpa o estado de erro após sucesso.
          setMsg(data.message); // Exibe a confirmação da restauração.
          const { data: lista } = await api.get("/admin/backups"); // Atualiza a lista que inclui a cópia de segurança do estado anterior.
          setBackups(lista.backups); // Armazena as cópias atualizadas.
        } catch (error) { // Trata falhas da restauração.
          setMsgError(true); // Marca a mensagem como erro.
          setMsg(error.response?.data?.message || "Não foi possível iniciar a restauração."); // Apresenta a causa em português.
        } // Finaliza o tratamento da solicitação de restauração.
      }; // Finaliza a ação de restauração.

      return ( // Renderiza os controles administrativos e os logs.
        <div className="space-y-6"> {/* Agrupa as seções da tela de administração. */}
          <h1 className="text-2xl font-bold">Administração — Logs e Backups</h1> {/* Identifica a área administrativa. */}
          <div className="bg-white p-5 rounded-xl shadow-sm border flex justify-between items-center"> {/* Exibe os detalhes da rotina de cópias. */}
            <div> {/* Agrupa título e frequência de backup. */}
              <h2 className="font-semibold">Backups do banco de dados</h2> {/* Identifica a área de backup. */}
              <p className="text-sm text-slate-500">Cópias diárias às 02:00, com retenção das 30 mais recentes.</p> {/* Explica a frequência e retenção configuradas. */}
            </div> {/* Finaliza os detalhes da rotina. */}
            <button onClick={criarBackup} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">Criar Backup Agora</button> {/* Permite criar uma cópia manual. */}
          </div> {/* Finaliza o painel de cópias. */}
          <div className="bg-white p-5 rounded-xl shadow-sm border flex flex-col sm:flex-row gap-3 sm:items-center"> {/* Agrupa seleção e restauração. */}
            <label className="flex-1 text-sm text-slate-600">Backup para restaurar {/* Identifica a lista de cópias disponíveis. */}
              <select value={backupSelecionado} onChange={(event) => setBackupSelecionado(event.target.value)} className="mt-1 w-full border rounded-lg p-2"> {/* Permite escolher a cópia desejada. */}
                <option value="">Nenhum backup disponível</option> {/* Informa quando não existem cópias. */}
                {backups.map((backup) => <option key={backup.name} value={backup.name}>{backup.name} — {(backup.size / 1024).toFixed(1)} KB — {new Date(backup.created_at).toLocaleString()}</option>)} {/* Exibe identificação, tamanho e data de cada cópia. */}
              </select> {/* Finaliza a lista de seleção. */}
            </label> {/* Finaliza o rótulo da cópia. */}
            <button onClick={restaurar} disabled={!backupSelecionado} className="bg-amber-600 hover:bg-amber-700 disabled:opacity-50 text-white px-4 py-2 rounded-lg font-medium">Restaurar Backup Selecionado</button> {/* Inicia a restauração após confirmação explícita. */}
          </div> {/* Finaliza o painel de restauração. */}
          {msg && <div className={`p-3 border rounded-lg text-sm ${msgError ? "bg-red-50 text-red-700 border-red-200" : "bg-emerald-50 text-emerald-800 border-emerald-200"}`}>{msg}</div>} {/* Exibe o resultado das ações administrativas. */}
          <div className="bg-white p-5 rounded-xl shadow-sm border overflow-x-auto"> {/* Apresenta a tabela de auditoria. */}
            <h2 className="font-semibold mb-3">Logs de Acesso e Operação</h2> {/* Identifica a tabela de eventos. */}
            <table className="w-full text-left text-sm"> {/* Organiza os eventos em colunas. */}
              <thead className="border-b text-slate-500"> {/* Exibe os nomes das colunas. */}
                <tr><th className="py-2">Data / Hora</th><th className="py-2">Usuário</th><th className="py-2">IP</th><th className="py-2">Ação</th></tr> {/* Nomeia cada campo de auditoria. */}
              </thead> {/* Finaliza o cabeçalho da tabela. */}
              <tbody> {/* Exibe os eventos carregados. */}
                {logs.map((l) => ( // Renderiza uma linha por evento auditado.
                  <tr key={l.id} className="border-b last:border-0"> {/* Identifica cada linha pelo ID do evento. */}
                    <td className="py-2">{new Date(l.created_at).toLocaleString()}</td><td className="py-2">{l.user?.email ?? l.actor}</td><td className="py-2 font-mono text-xs">{l.ip_address ?? "--"}</td><td className="py-2">{l.action}</td> {/* Apresenta data, usuário, endereço e ação. */}
                  </tr> // Finaliza a linha do evento.
                ))} {/* Finaliza a lista de eventos. */}
                {logs.length === 0 && <tr><td className="py-2 text-slate-500" colSpan="4">Nenhum evento registrado.</td></tr>} {/* Informa quando ainda não há eventos. */}
              </tbody> {/* Finaliza o corpo da tabela. */}
            </table> {/* Finaliza a tabela de auditoria. */}
          </div> {/* Finaliza o painel de logs. */}
        </div> // Finaliza a área administrativa.
      ); // Finaliza a renderização da tela.
    } // Finaliza o componente administrativo.
    // Controle Principal de Navegação
    // Restaura a sessão e escolhe as telas conforme o estado autenticado e o perfil recebido.
    function App() {
      const [user, setUser] = useState(() => {
        const salvo = localStorage.getItem("user");
        return salvo ? JSON.parse(salvo) : null;
      });
      const [aba, setAba] = useState("dashboard");

      const sair = async () => {
        try {
          await api.post("/auth/logout");
        } catch (error) {
          console.error("Não foi possível revogar o token no Laravel.", error);
        }
        localStorage.removeItem("user");
        localStorage.removeItem("token");
        setUser(null);
      };

      if (!user) return <TelaLogin onLogin={setUser} />;

      return (
        <div>
          <nav className="bg-slate-900 text-white px-6 py-3 flex flex-wrap justify-between items-center gap-4">
            <div className="flex items-center gap-4">
              <span className="font-bold text-blue-400">LTR701 Web</span>
              <button onClick={() => setAba("dashboard")} className={`text-sm ${aba === "dashboard" ? "underline font-semibold" : "text-slate-300"}`}>
                Dashboard & Controle
              </button>
              <button onClick={() => setAba("simulacao")} className={`text-sm ${aba === "simulacao" ? "underline font-semibold" : "text-slate-300"}`}>
                Sombra Digital
              </button>
              {user.role === "admin" && (
                <button onClick={() => setAba("admin")} className={`text-sm text-amber-400 ${aba === "admin" ? "underline font-semibold" : ""}`}>
                  Admin (Logs/Backup)
                </button>
              )}
            </div>
            <div className="flex items-center gap-3 text-sm">
              <span className="text-slate-300">{user.name} ({user.role})</span>
              <button onClick={sair} className="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded">Sair</button>
            </div>
          </nav>

          <main className="max-w-6xl mx-auto p-6">
            {aba === "dashboard" && <TelaDashboard />}
            {aba === "simulacao" && <TelaSimulacao />}
            {aba === "admin" && user.role === "admin" && <TelaAdmin />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
